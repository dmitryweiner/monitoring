[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-monitoring"
version = "0.1.0"
description = "SBC telemetry, durable photo delivery and private API"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "Pillow>=11,<13"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
monitor-agent = "monitoring.agent:main"
monitor-admin = "monitoring.admin:main"

[tool.setuptools.packages.find]
include = ["monitoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
